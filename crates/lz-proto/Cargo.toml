[package]
name = "lz-proto"
version = "0.0.1"
description = "Lantern Zero protocol v0: wire types, padding, tokens, event ids, replay window"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Keep this list small: wallet SDKs embed this crate. No tokio, no TLS, no
# Zcash crates.
[dependencies]
base64 = "0.23"
crc32fast = "1.4"
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
