# Example configuration. TLS is terminated in front of the server.
listen = "127.0.0.1:8080"
public_host = "lz.example.org"
base_path = ""
network = "main"
data_dir = "./lz-data"
vapid_contact = "mailto:ops@example.org"

[chain]
# Zaino or lightwalletd gRPC. Use https:// for anything off this host or
# private network.
lightwalletd = "http://127.0.0.1:8137"
poll_secs = 5

[push]
# Self-hosters may restrict pushes to their wallet vendor's gateway:
# gateway_allowlist = ["push.examplewallet.app"]
max_devices_per_account = 10

# Memory hygiene (spec §6.2). With [chain], the server refuses to start
# unless its memory is locked (memlock limit unlimited) or swap can't hold
# it. Set this only if swap is encrypted.
# [hardening]
# allow_swap = false

# Who may scan, idle expiry, and the issuer socket (spec §4.6;
# server/ISSUER.md). These defaults change nothing: every account may scan,
# none expire, no socket.
[accounts]
scanning = "all"          # or "entitled": only accounts with scanning time left
idle_account_days = 0     # 0 = never; otherwise at least 8
issuer_socket = false     # true: serve <data_dir>/issuer.sock (mode 0600)

[limits]
# Requests per minute. A foreground wallet long-polls about every 25 s.
account_per_minute = 120
device_per_minute = 30
