[package]
name = "lz-server"
version = "0.0.1"
description = "Lantern Zero server: OHTTP gateway, v0 API, wake-up scheduler"
edition.workspace = true
# Not embedded in wallets, so not bound by the 1.86 minimum.
# zcash_client_backend 0.25 (the first with Ironwood) needs 1.89.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lz-proto = { path = "../crates/lz-proto" }
axum = "0.8"
base64 = "0.22"
bhttp = "0.8"
http = "1"
httpdate = "1"
ohttp = { version = "0.8", default-features = false, features = ["server", "rust-hpke"] }
aes-gcm = "0.11"
hkdf = "0.13"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.8"
# Chain data from Zaino or lightwalletd (CompactTxStreamer). Generated
# client and compact block types; no wallet database.
zcash_client_backend = { version = "0.25", default-features = false, features = ["lightwalletd-tonic"] }
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-aws-lc", "tls-webpki-roots"] }
# Trial decryption and key decoding for the scanner. Same versions as
# zcash_client_backend 0.25.
orchard = { version = "0.16", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false, features = ["std"] }
zcash_note_encryption = "0.5.1"
zcash_address = "0.14"
zcash_protocol = "0.11"
# Parses full mempool transactions into compact form.
zcash_primitives = { version = "0.31", default-features = false, features = ["std"] }
subtle = "2.6"
time = { version = "0.3.47", features = ["formatting"] }

[dev-dependencies]
# A fake CompactTxStreamer for the chain follower tests.
tonic = { version = "0.14", default-features = false, features = ["server", "router"] }
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
# Building real (unproven) transactions for the mempool tests. The Zcash
# crates use rand 0.10; the server itself uses 0.9.
rand010 = { package = "rand", version = "0.10" }
redjubjub = "0.9"
sapling = { package = "sapling-crypto", version = "0.9", default-features = false, features = ["std", "test-dependencies"] }
ohttp = { version = "0.8", default-features = false, features = ["client", "server", "rust-hpke"] }
serde_json = "1"

[lints]
workspace = true
