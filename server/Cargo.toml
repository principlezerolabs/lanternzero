[package]
name = "lz-server"
version = "0.0.1"
description = "Lantern Zero server: OHTTP gateway, v0 API, wake-up scheduler"
edition.workspace = true
# Not embedded in wallets, so not bound by the 1.86 minimum. The fixed
# crypto-bigint (RUSTSEC-2026-0387) needs 1.87.
rust-version = "1.87"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lz-proto = { path = "../crates/lz-proto" }
axum = "0.8"
base64 = "0.22"
bhttp = "0.8"
http = "1"
httpdate = "1"
ohttp = { version = "0.8", default-features = false, features = ["server", "rust-hpke"] }
aes-gcm = "0.11"
hkdf = "0.13"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.8"

[dev-dependencies]
ohttp = { version = "0.8", default-features = false, features = ["client", "server", "rust-hpke"] }
serde_json = "1"

[lints]
workspace = true
