# cargo-deny policy. Wallets embed our client-side crates, so a bad
# dependency becomes their problem. Run `cargo deny check`.

# Every feature of our crates, so optional code people still run is
# checked too: the bindings generator (`lz-client-uniffi`'s `bindgen`) and
# `lz-client`'s `reqwest`. The same set as CI, whose cargo-deny-action
# passes `--all-features`.
[graph]
all-features = true

[advisories]
version = 2
# Fail on any RustSec advisory (vulnerable, unmaintained, unsound, yanked).
# To accept one, add its id here with a comment explaining why.
ignore = [
    # `basic-toml` is unmaintained (informational, no vulnerability, no
    # fixed version). It reaches us only through askama's proc-macro
    # (askama_derive, the latest 0.16.1), inside UniFFI's bindings
    # generator (`bindgen` feature): it runs in the compiler while the
    # generator builds, on UniFFI's own templates, and is never linked
    # into an app. Drop this when askama or uniffi_bindgen stops using it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, in the UniFFI bindings generator; no fix exists" },
]

[licenses]
version = 2
# Permissive licenses compatible with MIT OR Apache-2.0 distribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Mozilla's CA root list (webpki-root-certs, via reqwest). A permissive
    # data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Allowed licenses no current dependency uses are fine.
unused-allowed-license = "allow"

# UniFFI (client/uniffi only) is MPL-2.0: copyleft per file, so apps may
# link it into closed code, but changes to UniFFI's own files must be
# shared. Allowed for these crates only, not in general.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]
# The bindings generator (`bindgen` feature only): it writes the Swift and
# Kotlin sources and is never linked into an app.
[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # No C TLS stacks: use rustls where TLS is needed (server side only).
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

# ohttp: use the pure-Rust `rust-hpke` backend, never NSS, and never the
# feature that prints secrets (invariants 1 and 6).
[[bans.features]]
crate = "ohttp"
deny = ["nss", "gecko", "unsafe-print-secrets"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
