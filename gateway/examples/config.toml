# Example gateway configuration. TLS is terminated in front of the gateway.
listen = "127.0.0.1:8090"
# Proxies whose X-Forwarded-For names the client, for the per-address
# limits. Only these; from anyone else the header is ignored.
trusted_proxies = []
# Endpoints are built on this origin, and servers' VAPID tokens must name it.
public_origin = "https://push.example-wallet.app"
# Holds the endpoint-sealing keys and the revocation list. Losing it
# invalidates every endpoint and forgets every revocation.
data_dir = "./lz-gateway-data"
# Wallets renew subscriptions before this; at most 365.
endpoint_lifetime_days = 90
# Relayed by Apple and Google, so it must say nothing about the payment.
alert_title = "New activity"

[apns]
team_id = "ABCDE12345"
key_id = "KEY1234567"
# The .p8 auth key from Apple. Keep it out of the repository.
key_path = "/etc/lz-gateway/AuthKey_KEY1234567.p8"
# The wallet app's bundle id.
topic = "app.example.wallet"
# Where "apns" subscriptions go: false for production (TestFlight, App
# Store builds).
sandbox = false
# Also accept "apns-sandbox" subscriptions from development (Xcode) builds,
# sent to Apple's development environment with the same key.
allow_sandbox = false
# Optional: a separate key for "apns-sandbox", for Apple keys limited to
# this app (Apple then allows one environment per key).
# sandbox_key_id = "KEY7654321"
# sandbox_key_path = "/etc/lz-gateway/AuthKey_KEY7654321.p8"

[fcm]
project_id = "example-wallet"
# A service-account key with the Firebase Cloud Messaging API role.
credentials_path = "/etc/lz-gateway/fcm-service-account.json"

[limits]
# Spec §5.3: per device; background and alerts have separate budgets.
background_per_hour = 3
alerts_per_hour = 20
per_server_per_minute = 100000
# The open wallet API, per client address (IPv4 address or IPv6 /64).
subscriptions_per_address_per_hour = 60
revocations_per_address_per_hour = 60
