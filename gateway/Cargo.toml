[package]
name = "lz-gateway"
version = "0.0.1"
description = "Lantern Zero reference push gateway: Web Push in, APNs and FCM out"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.11"
gcp_auth = { version = "0.12", default-features = false, features = ["aws-lc-rs", "webpki-roots"] }
http = "1"
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.8"

[dev-dependencies]
# Real server code signs and encrypts the pushes the tests send.
lz-server = { path = "../server" }
lz-proto = { path = "../crates/lz-proto" }

[lints]
workspace = true
