version: 2
updates:
  # Keeps the SHA-pinned actions in CI current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates in one weekly PR; majors stay separate.
      cargo-minor:
        update-types: [minor, patch]
