name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.86 is the minimum for client-side crates (see CONTRIBUTING.md).
        toolchain: [stable, "1.86"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
      - run: rustup default ${{ matrix.toolchain }}
      - if: matrix.toolchain == 'stable'
        run: cargo test --workspace --locked
      # The 1.86 minimum covers only client-side crates (CONTRIBUTING.md).
      - if: matrix.toolchain != 'stable'
        run: cargo test -p lz-proto --locked
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --all --check
      - if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  privacy-guards:
    name: privacy guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      # Client-side crates are embedded in wallet SDKs: no async runtime, no
      # TLS stack, no Zcash crates that would clash with the SDK's pins.
      - name: keep client-side crates light
        run: |
          for crate in lz-proto; do
            if cargo tree -p "$crate" --locked --target all -e normal --prefix none \
                | grep -E '^(tokio|rustls|openssl|native-tls|zcash_client_backend|zcash_client_sqlite) '; then
              echo "$crate pulls in a forbidden dependency"; exit 1
            fi
          done

  # Advisories, licenses, banned crates and features (including ohttp's
  # nss and unsafe-print-secrets), and sources. Policy: deny.toml.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
