name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the channel and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash scripts/privacy-guards.sh
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete
      - uses: crate-ci/typos@3be83342e28b9421997e9f781f713f8dde8453d2 # v1.31.2

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.89 is the minimum for every crate, the same as librustzcash's
        # (see CONTRIBUTING.md).
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      # Explicit +toolchain overrides rust-toolchain.toml (fmt/clippy pin).
      - if: matrix.toolchain == 'stable'
        run: cargo +stable test --workspace --locked
      - if: matrix.toolchain == '1.89'
        run: cargo +1.89 test --workspace --locked

  # Integration tests against real Zebra and Zaino on a private regtest
  # chain (deploy/regtest).
  regtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: docker compose -f deploy/regtest/compose.yaml up -d --wait
      - run: cargo +stable test -p lz-server --test regtest --locked -- --ignored --test-threads 1
      - if: failure()
        run: docker compose -f deploy/regtest/compose.yaml logs --tail 200
      - if: always()
        run: docker compose -f deploy/regtest/compose.yaml down

  # Canary: the same tests on a regtest chain that activates NU7 at height
  # 10. Zaino 0.10.x can't parse NU7 blocks yet (zingolabs/zaino#1731),
  # so this is allowed to fail; it turns green once a fixed Zaino is pinned.
  regtest-nu7:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ZEBRA_CONFIG: zebrad-nu7.toml
      LZ_REGTEST_NU7: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: docker compose -f deploy/regtest/compose.yaml up -d --wait
      - run: cargo +stable test -p lz-server --test regtest --locked -- --ignored --test-threads 1 crosses_the_nu7_boundary
      - if: failure()
        run: docker compose -f deploy/regtest/compose.yaml logs --tail 50 zaino
      - if: always()
        run: docker compose -f deploy/regtest/compose.yaml down

  # Advisories, licenses, banned crates and features (including ohttp's
  # nss and unsafe-print-secrets), and sources. Policy: deny.toml.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
