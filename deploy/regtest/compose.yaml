# A private regtest chain (Zebra + Zaino) for the server's integration tests.
# deploy/regtest/test.sh runs them on a chain of its own. Or, for a chain
# that stays up (on ports 18232 and 8137 unless LZ_REGTEST_ZEBRA_PORT and
# LZ_REGTEST_ZAINO_PORT say otherwise; empty means Docker picks):
#   docker compose -f deploy/regtest/compose.yaml up -d --wait
#   cargo test -p lz-server --test regtest -- --ignored --test-threads 1
#   docker compose -f deploy/regtest/compose.yaml down
# Images are pinned by digest. Zaino publishes amd64 only; on Apple silicon
# it runs under emulation.
name: lz-regtest

services:
  zebra:
    # zfnd/zebra:7.0.0
    image: zfnd/zebra@sha256:a70d2be8ffef3a4b6e37355724e36a0e6c1838e46baa28bfb216739f00cf2d34
    volumes:
      # ZEBRA_CONFIG=zebrad-nu7.toml activates NU7 at height 10 (see README).
      - ./${ZEBRA_CONFIG:-zebrad.toml}:/home/zebra/.config/zebrad.toml:ro
    ports:
      - "127.0.0.1:${LZ_REGTEST_ZEBRA_PORT-18232}:18232"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'content-type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getblockchaininfo\",\"params\":[]}' http://127.0.0.1:18232"]
      interval: 2s
      retries: 30

  # Zaino wants a non-empty chain at startup: mine the first blocks.
  seed:
    image: zfnd/zebra@sha256:a70d2be8ffef3a4b6e37355724e36a0e6c1838e46baa28bfb216739f00cf2d34
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -sf -H 'content-type: application/json'
        -d '{"jsonrpc":"2.0","id":1,"method":"generate","params":[5]}'
        http://zebra:18232
    depends_on:
      zebra:
        condition: service_healthy

  zaino:
    # zingodevops/zainod:0.10.1-no-tls, which stops at NU7 (README.md). For
    # the NU7 fallback built from deploy/zaino/, set
    #   LZ_ZAINO_IMAGE=lantern-zero/zainod:nu7 LZ_ZAINO_PLATFORM=<this host's, e.g. linux/arm64>
    image: ${LZ_ZAINO_IMAGE:-zingodevops/zainod@sha256:c8428a39d510fd59a9182a5e19cf473d6af6a4b6a672aff8b1a690e9c23c17b9}
    platform: ${LZ_ZAINO_PLATFORM:-linux/amd64}
    command: ["start", "--config", "/etc/zaino/zainod.toml"]
    volumes:
      - ./zainod.toml:/etc/zaino/zainod.toml:ro
    ports:
      - "127.0.0.1:${LZ_REGTEST_ZAINO_PORT-8137}:8137"
    depends_on:
      seed:
        condition: service_completed_successfully
