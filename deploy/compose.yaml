# Lantern Zero self-hosting kit (deploy/README.md, deploy/DESIGN.md).
#
#   cp .env.example .env        # then edit it
#   docker compose build
#   docker compose run --rm init  # starts Tor first
#   docker compose up -d
#
# With no profile this is `byo-node`: the server and Tor, pointed at a
# Zebra/Zaino or lightwalletd you already run (LZ_LIGHTWALLETD). With
# COMPOSE_PROFILES=full it runs Zebra and Zaino too.
#
# Hardening for spec §6.2 is set here; `doctor` checks it:
#   docker compose exec server lz-server /var/lib/lantern-zero/config.toml doctor
name: lantern-zero

x-logging: &logging
  # stdout only, size-capped. The server never logs tokens, endpoints, or
  # request bodies.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging: *logging

# Built here by default. To use the published, signed images instead, set
# LZ_SERVER_IMAGE and LZ_TOR_IMAGE in .env to their digests (README.md,
# "Published images").
x-server-image: &server-image
  image: ${LZ_SERVER_IMAGE:-lantern-zero/server:local}
  build:
    context: ..
    dockerfile: deploy/server.Dockerfile

services:
  server:
    <<: [*server-image, *hardening]
    restart: unless-stopped
    ulimits:
      # No core dumps, and enough locked memory for mlockall, so viewing
      # keys never reach a dump or swap (invariant 1).
      core: 0
      memlock:
        soft: -1
        hard: -1
    # Locked memory counts against the limit: size it for the peak (the
    # mempool snapshot alone may reach 64 MiB). Equal limits also keep the
    # container off swap.
    mem_limit: ${LZ_SERVER_MEMORY:-1g}
    memswap_limit: ${LZ_SERVER_MEMORY:-1g}
    volumes:
      - lz-data:/var/lib/lantern-zero
    networks:
      lz:
        # Tor's HiddenServicePort needs an IP address.
        ipv4_address: ${LZ_SERVER_IP:-172.30.77.10}
      chain: {}
    extra_hosts:
      # For byo-node with a node on this machine (LZ_LIGHTWALLETD).
      - host.docker.internal:host-gateway
    depends_on:
      zaino:
        condition: service_started
        required: false

  tor:
    <<: *hardening
    image: ${LZ_TOR_IMAGE:-lantern-zero/tor:local}
    build: tor
    restart: unless-stopped
    command:
      - --HiddenServiceDir
      - /var/lib/tor/lz
      - --HiddenServicePort
      - 80 ${LZ_SERVER_IP:-172.30.77.10}:8080
    volumes:
      - tor-data:/var/lib/tor
    networks:
      lz: {}

  # One-shot: `docker compose run --rm init`. Writes the config, keys, and
  # first account, and prints the connection URL once. Run it again with
  # other options to override the defaults below, for example
  #   docker compose run --rm init --network test --onion-hostname-file \
  #     /tor/lz/hostname --lightwalletd http://... --vapid-contact mailto:...
  init:
    <<: [*server-image, *hardening]
    profiles: [tools]
    entrypoint: ["/usr/local/bin/lz-server", "/var/lib/lantern-zero/config.toml", "init"]
    command:
      - --network
      - ${LZ_NETWORK:-main}
      - --onion-hostname-file
      - /tor/lz/hostname
      - --lightwalletd
      - ${LZ_LIGHTWALLETD:-http://zaino:8137}
      - --vapid-contact
      - ${LZ_VAPID_CONTACT:?set LZ_VAPID_CONTACT in .env}
      - --listen
      - 0.0.0.0:8080
    volumes:
      - lz-data:/var/lib/lantern-zero
      # Only to read the hostname Tor wrote; the server never mounts it.
      - tor-data:/tor:ro
    network_mode: none
    depends_on:
      # Healthy once Tor has written the onion hostname.
      tor:
        condition: service_healthy

  zebra:
    profiles: [full]
    # zfnd/zebra:7.0.0
    image: zfnd/zebra@sha256:a70d2be8ffef3a4b6e37355724e36a0e6c1838e46baa28bfb216739f00cf2d34
    restart: unless-stopped
    volumes:
      - ./zebra/zebrad.toml:/home/zebra/.config/zebrad.toml:ro
      - zebra-state:/home/zebra/.cache/zebra
    networks:
      # `lz` for peer-to-peer traffic; `chain` for Zaino.
      lz: {}
      chain: {}
    logging: *logging

  zaino:
    profiles: [full]
    # zingodevops/zainod:0.10.1-no-tls. It stops at NU7 until
    # zingolabs/zaino#1731 is fixed; see deploy/README.md.
    image: zingodevops/zainod@sha256:c8428a39d510fd59a9182a5e19cf473d6af6a4b6a672aff8b1a690e9c23c17b9
    platform: linux/amd64
    restart: unless-stopped
    command: ["start", "--config", "/etc/zaino/zainod.toml"]
    volumes:
      - ./zaino/zainod.toml:/etc/zaino/zainod.toml:ro
      - zaino-data:/zaino-data
    networks:
      chain: {}
    depends_on:
      - zebra
    logging: *logging

networks:
  # Egress for push deliveries, Tor, and Zebra's peers. Change the subnet
  # (and LZ_SERVER_IP) if it collides with one you use.
  lz:
    ipam:
      config:
        - subnet: ${LZ_SUBNET:-172.30.77.0/24}
  # Chain data only: no route out.
  chain:
    internal: true

volumes:
  lz-data:
  tor-data:
  zebra-state:
  zaino-data:
